# Trading-Bot — Konfiguration
# Alle Stellschrauben der Strategie stehen hier. Zugangsdaten stehen NICHT hier,
# sondern in der Umgebung (siehe .env.example).

[risk]
risk_per_trade_pct     = 0.5    # Anteil des Depots, der pro Trade bis zum Stop riskiert wird
max_position_leverage  = 1.0    # größte Einzelposition als Vielfaches des Depots
max_gross_leverage     = 3.0    # Summe aller Positionen als Vielfaches des Depots
max_open_positions     = 4
max_trades_per_day     = 20
daily_loss_limit_pct   = 2.0    # ab diesem Tagesverlust keine neuen Einstiege mehr
min_price              = 5.0    # keine Aktien unter diesem Kurs

[execution]
entry_limit_offset_pct   = 0.15  # Einstiegslimit so weit über/unter dem letzten Kurs
entry_timeout_s          = 20    # nicht ausgeführte Einstiege nach dieser Zeit streichen
flatten_before_close_min = 10    # so viele Minuten vor Börsenschluss alles glattstellen
poll_s                   = 5     # Prüfintervall für offene Trades

[extended]
# Handel vor Börsenbeginn (4:00 bis 9:30 Uhr New Yorker Zeit, also 10:00 bis 15:30 Uhr deutscher Zeit)
# und nach Börsenschluss (16:00 bis 20:00 Uhr, also 22:00 bis 2:00 Uhr deutscher Zeit).
# Dort nimmt der Broker nur einfache Limit-Orders an. Das Kursziel liegt deshalb als Limit-Order beim
# Broker; Stop, Zeitlimit und Sitzungsende überwacht der Bot selbst und schließt mit Limit-Orders
# durch den Markt. Welcher Kurs zählt: der, mit dem der Broker die offene Position selbst bewertet (er folgt
# auch dort dem ganzen Markt; die kostenlose Kursquelle zeigt dort fast nichts).
# Eingeschaltet am 19.11.2026 mit Joshs Freigabe (15:17 Uhr), aktiv ab dem Neustart um 22:07 Uhr.
enabled                     = true
poll_s                      = 2     # Prüfintervall, solange eine solche Position offen ist
flatten_before_end_min_pre  = 10    # vorbörslich alles glatt bis 9:20 Uhr New Yorker Zeit (15:20 Uhr deutscher Zeit)
flatten_before_end_min_post = 15    # nachbörslich alles glatt bis 19:45 Uhr (1:45 Uhr deutscher Zeit)
no_entry_before_flatten_min = 10    # so lange davor keine neuen Einstiege mehr
blind_exit_s                = 60    # bewegt sich der Kurs der Position so lange nicht und zeigt auch die Kursquelle nichts:
                                    # Position schließen (ein Stop, der nichts sieht, schützt nicht)
trade_fresh_s               = 10    # die Kursquelle zählt dabei, wenn ihr letzter Handel höchstens so alt ist ...
max_mark_spread_pct         = 0.6   # ... oder Geld- und Briefkurs höchstens so weit auseinanderliegen
exit_limit_offset_pct       = 0.5   # Ausstiegs-Limit so weit durch den Markt (beim Verkauf unter dem Geldkurs)
exit_offset_step_pct        = 0.5   # bei jedem weiteren Versuch um so viel weiter
exit_offset_max_pct         = 5.0
exit_retry_s                = 4     # nicht ausgeführten Ausstieg nach dieser Zeit weiter durch den Markt neu senden
guard_stale_s               = 180   # der Wächter schließt offene Positionen, wenn der Bot so lange kein Lebenszeichen gegeben hat

[fast]
# Sofort-Einstieg nach einer frischen Meldung: vor der Börse, in der Handelszeit und nach der Börse
# (vor und nach der Börse braucht er [extended]).
# Erste Fassung (Freigabe Josh 19.11.2026): Limit ab dem letzten Kurs VOR der Meldung, Stop und Ziel ab
# dem Ausführungskurs. Zweite Fassung (Freigabe Josh 24.11.2026, Vorschlag vom 20.11.): Vor dem Einstieg
# stellt der Bot Geld- und Briefkurs fest ([fast.look]) und steigt nur bei enger Spanne ein; der
# Sofort-Einstieg läuft auch in der Handelszeit. Schwerpunkt sind Meldungen ohne Quartalszahlen.
enabled            = true
sessions           = ["pre", "regular", "post"]
regular_start_after_open_min      = 5    # in der Handelszeit: kein Einstieg in den ersten Minuten ...
regular_no_entry_before_close_min = 30   # ... und kurz vor Schluss (wie die alte Regel)
shadows            = true     # die Modelle aus [llm] shadow bewerten jede Meldung mit (fast_shadow), ohne Einfluss auf den Handel
max_age_s          = 300      # so alt darf die Meldung höchstens sein (PR Newswire kommt 1,5 bis 3,5 Minuten verspätet)
min_surprise       = 7        # KI-Bewertung 0-10
min_confidence     = 7        # KI-Bewertung 0-10
min_impact         = 1        # mindestens "mittel"
min_dollar_volume  = 3000000  # Aktien mit weniger Tagesumsatz werden gar nicht erst bewertet
chase_frac         = 0.5      # so viel der erwarteten Bewegung darf der Kurs schon gelaufen sein (Limit); ebenso weit
                              # gegen die Bewertung gelaufen = sofort wieder raus
stop_mult          = 1.5      # der Stop liegt so viel weiter weg als bei der alten Regel
risk_pct           = 0.25     # Risiko je Trade in Prozent des Depots
max_notional       = 10000    # höchstens so viele Dollar je Position (Freigabe Josh 19.11.2026)
max_notional_small = 5000     # bei kleinen Firmen (unter 20 Mio. $ Tagesumsatz)
max_open           = 1        # eine Position zur Zeit (Freigabe Josh 19.11.2026)
entry_timeout_s    = 15       # nicht ausgeführten Einstieg nach dieser Zeit streichen
reference_max_age_h = 96      # so alt darf der Kurs vor der Meldung höchstens sein (übers Wochenende: Schlusskurs vom Freitag)
fetch_text         = true     # den vollen Text der Pressemitteilung holen (sonst nur Überschrift und Anriss)
text_chars         = 6000     # so viele Zeichen davon bekommt die KI

[fast.expected_move_pct]      # erwartete Bewegung je Wirkungs-Stufe der KI, in Prozent
1 = 2.0
2 = 5.0
3 = 10.0

[fast.max_hold_min]           # Zeitlimit je Sitzung (Freigabe Josh 19.11.2026: höchstens 15 Minuten)
pre     = 15
regular = 15
post    = 10

[fast.look]
# Blick auf den Markt vor dem Einstieg (zweite Fassung). Geld- und Briefkurs kommen aus der Kursquelle,
# wenn sie beide zeigt und sie frisch sind, sonst aus einer Probe: 1 Aktie in Richtung der Bewertung
# handeln und sofort zurückhandeln; die beiden Ausführungskurse sind Brief- und Geldkurs.
# In der Handelszeit zählen Stop und Ziel ab dem so gesehenen Kurs und gehen mit der Order zum Broker.
enabled          = true
quote_fresh_s    = 10     # so alt darf der Kurs der Kursquelle höchstens sein
max_spread_pct   = 0.5    # Einstieg nur, wenn Geld- und Briefkurs höchstens so weit auseinanderliegen
max_against_pct  = 0.5    # ... und der Kurs seit vor der Meldung höchstens so weit GEGEN die Bewertung gelaufen ist
limit_offset_pct = 0.2    # Limit der Order: so weit über dem Briefkurs (beim Leerverkauf unter dem Geldkurs),
                          # höchstens das Limit der ersten Fassung
probe_wait_s     = 3      # je Schritt der Probe höchstens so lange warten
probe_back_pct   = 0.5    # das Zurückhandeln der Probe darf höchstens so viel schlechter sein; klappt das nicht,
                          # ist die Spanne zu weit, und die eine Aktie geht mit einem Limit weit durch den Markt zurück

[news]
# Alte Regel mit Kursbestätigung. Abgeschaltet am 24.11.2026 (Entscheidung Josh): Pressemitteilungen
# gehen an den Sofort-Einstieg, und Alpacas Nachrichtenstrom (Stunden verspätet, jede siebte Meldung
# zur falschen Firma) wird nicht mehr bewertet und nicht mehr gehandelt. Die Werte unten braucht der
# Sofort-Einstieg weiter (Stop und Ziel je Wirkungs-Stufe, Schwankungsfaktor).
enabled                  = false
stream                   = false   # Alpacas Nachrichtenstrom gar nicht erst verbinden
max_article_age_s        = 90    # ältere Meldungen aus Alpacas Strom werden nicht mehr gehandelt
max_symbols              = 3     # Meldungen mit mehr Aktien sind Sammelartikel
min_surprise             = 7     # KI-Bewertung 0-10: wie überraschend
min_confidence           = 6     # KI-Bewertung 0-10: wie sicher die Richtung
min_impact               = 1     # KI-Bewertung 0-3: erwartete Kursbewegung; 0 = kaum, wird nicht gehandelt
confirm_window_s         = 300   # so lange auf Bestätigung durch den Kurs warten
min_move_pct             = 0.4   # Kurs muss mindestens so weit in die Richtung gelaufen sein (x Schwankungsfaktor)
max_chase_pct            = 3.0   # ist er schon weiter gelaufen, wird nicht hinterhergekauft (x Schwankungsfaktor)
volume_mult              = 2.0   # Minutenvolumen gegenüber dem Schnitt der letzten 30 Minuten
max_spread_pct           = 0.3   # größere Geld-/Brief-Spanne = zu illiquide
symbol_cooldown_min      = 60    # nach einem Signal Pause für dieselbe Aktie
start_after_open_min     = 5
no_entry_before_close_min = 30

# Schwankungsfaktor: übliche Tagesspanne der Aktie geteilt durch die einer Durchschnittsaktie.
# Stop, Mindestbewegung und Höchstbewegung werden damit multipliziert.
reference_daily_range_pct = 2.5
vol_factor_min           = 0.6
vol_factor_max           = 2.0
noise_mult               = 0.5   # der Stop liegt mindestens so viel x Kursspanne der letzten 5 Minuten entfernt
stop_floor_pct           = 0.3   # engster erlaubter Stop
stop_cap_pct             = 4.0   # weitester erlaubter Stop

# Handelsspanne je Wirkungs-Stufe der KI (für eine Durchschnittsaktie).
# stop_pct = Stop-Abstand, target_r = Kursziel als Vielfaches des Stop-Abstands.
[news.impact.1]   # mittel: etwa 1-3 % erwartet
stop_pct = 0.5
target_r = 2.0
max_hold_min = 30

[news.impact.2]   # groß: etwa 3-8 % erwartet
stop_pct = 1.0
target_r = 3.0
max_hold_min = 60

[news.impact.3]   # sehr groß: über 8 % erwartet
stop_pct = 2.0
target_r = 3.0
max_hold_min = 90

[orb]
# Abgeschaltet am 17.11.2026 (Entscheidung Josh): In der Rückrechnung verliert die kurze Form
# schon vor Kosten. Damit werden auch Meldungen außerhalb der Handelszeit nicht mehr bewertet.
enabled                  = false
range_min                = 5     # Länge der Eröffnungsspanne in Minuten (5, 10, 15 oder 30)
min_price                = 10.0
min_gap_pct              = 1.0   # Mindest-Kurslücke zur Eröffnung (gilt nicht für News-Kandidaten)
max_gap_pct              = 30.0  # darüber ist es meist ein Datenfehler oder eine Sondersituation
min_rvol                 = 1.0   # Volumen der Spanne gegenüber dem Schnitt der letzten 10 Tage
min_range_dollar_volume  = 1000000  # Mindestumsatz in der Spanne (auf dem IEX-Datenfeed)
min_range_pct            = 0.2   # zu enge Spanne = Zufallsausbruch
max_range_pct            = 2.5   # zu weite Spanne = Bewegung ist schon gelaufen
max_candidates           = 8     # die mit dem höchsten relativen Volumen werden beobachtet
exclude_funds            = true  # keine ETFs und Hebelprodukte
breakout_buffer_pct      = 0.05
stop_range_frac          = 0.5   # Stop-Abstand = Faktor x Breite der Spanne
stop_min_pct             = 0.3
stop_max_pct             = 1.0
target_r                 = 2.0
max_hold_min             = 30    # Zeitlimit pro Trade
direction                = "both"   # "both", "gap" (nur in Richtung der Kurslücke) oder "range" (nur in Richtung der Spanne)
entry_until              = "11:00"  # New Yorker Zeit, danach keine neuen Ausbrüche
# Meldungen außerhalb der Handelszeit liefern Kandidaten für die nächste Eröffnung:
premarket_news_from      = "00:00"  # New Yorker Zeit; zusammen mit dem Abend davor = durchgehend ab Börsenschluss
premarket_news_min_surprise = 6
news_candidate_max_age_h = 20    # ältere Meldungen zählen für die nächste Eröffnung nicht mehr
max_news_candidates      = 40    # höchstens so viele News-Kandidaten kommen in den Pool
# Liquide, schwankungsfreudige Aktien, die immer mit geprüft werden
static_pool = ["NVDA", "TSLA", "AMD", "META", "AMZN", "AAPL", "MSFT", "PLTR", "COIN", "AVGO", "NFLX", "SMCI", "MU", "GOOGL", "INTC", "MSTR", "HOOD", "UBER", "BA", "JPM"]

[wires]
# Pressemitteilungen direkt von den Verteilern (PR Newswire, GlobeNewswire, Business Wire).
# Jede Firma nutzt einen Verteiler; erst alle zusammen decken die meisten Berichte ab.
# Kommt dieselbe Nachricht mehrfach (zweiter Verteiler, Alpacas Strom), zählt nur die erste.
enabled     = true
fast_poll_s = 10    # der Haupt-Feed jedes Verteilers (jeweils der erste in der Liste); abgewiesene Feeds (403, 429) erst nach 10 Minuten wieder
poll_s      = 60    # die Themen-Feeds
max_age_s   = 420   # so alt darf eine Pressemitteilung für einen Trade höchstens sein
same_news_min = 15  # gleiche Aktie, ähnliche Überschrift oder beides Ergebnisse binnen 15 Minuten = dieselbe Nachricht
# Diese Quellen werden bewertet und gehandelt; fehlt eine, wird sie nur gemessen. "wa-..." = dieselben
# Verteiler über WireAlpha (Entscheidung Josh 24.11.2026: gleich handeln, nicht erst messen).
trade = ["prnewswire", "businesswire", "globenewswire",
         "wa-prnewswire", "wa-businesswire", "wa-globenewswire", "wa-accesswire"]
# PR Newswire
feeds = [
  "https://www.prnewswire.com/rss/news-releases-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/earnings-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/earnings-forecasts-projections-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/acquisitions-mergers-and-takeovers-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/contracts-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/stock-offering-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/restructuring-recapitalization-list.rss",
  "https://www.prnewswire.com/rss/health-latest-news/fda-approval-list.rss",
  "https://www.prnewswire.com/rss/health-latest-news/clinical-trials-medical-discoveries-list.rss",
  "https://www.prnewswire.com/rss/general-business-latest-news/personnel-announcements-list.rss",
]

[wires.more]
# globenewswire: weist den Server ab (403 seit dem ersten Abruf am 23.11., auch mit Pause); Code bleibt, Feeds siehe Git-Historie
businesswire = [
  "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEF9YXA==",   # Ergebnisse
  "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFtRWA==",   # Übernahmen
  "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFtRWw==",   # Produkte und Dienste
  "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFpQWg==",   # Technologie
  "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeGFNZWg==",   # FDA
]

[finnhub_news]
# Nachrichten von Finnhub (kostenloses Konto): allgemeine Marktnachrichten und die Nachrichten der Firmen,
# die heute berichten. Finnhub sammelt bei anderen Seiten ein; nur messen, nicht handeln (steht nicht in
# [wires] trade). Ob es je schneller ist als die Verteiler, zeigt news_dup.
# Abgeschaltet am 24.11.2026: gemessen 13 bis 14 Minuten nach der Veröffentlichung, nie zuerst.
enabled        = false
categories     = ["general", "merger"]
market_every_s = 20      # die Marktnachrichten so oft
company_every_s = 120    # jede berichtende Firma so oft
max_companies  = 40

[wirealpha]
# Pressemitteilungen von WireAlpha (kostenlos, verspricht Zustellung in unter einer Sekunde; ungeprüft,
# junger Anbieter). Jede Meldung steht als wire_item mit der Quelle "wa-<verteiler>" im Protokoll; ob
# sie wirklich früher kommt als die Feeds der Verteiler, zeigt die Wochenstatistik ("Nachrichtenquellen").
# Bewertet und gehandelt wird, was in [wires] trade steht: seit 24.11.2026 die vier Verteiler (Entscheidung
# Josh: gleich handeln). Kommt dieselbe Meldung auch über den Feed des Verteilers, zählt die erste.
# Läuft nur mit Schlüssel auf dem Server: bash deploy/set-keys.sh wirealpha
enabled = true
sources = ["prnewswire", "businesswire", "globenewswire", "accesswire", "sec_edgar"]
          # sec_edgar: Pflichtmitteilungen, wie WireAlpha sie meldet. Nur gemessen (zeigt, ob WireAlpha sie
          # früher sieht als der Bot selbst); gehandelt werden Pflichtmitteilungen über die Liste der SEC ([edgar])
text_timeout_s = 3   # so lange auf den vollen Text einer Meldung warten; sonst wird die Überschrift allein bewertet

[edgar]
# Pflichtmitteilungen an die US-Börsenaufsicht SEC (Formular 8-K). Jede wird mitgeschrieben (Messung).
# Seit 24.11.2026 werden frische Meldungen außerdem gelesen und bewertet (Sofort-Einstieg, Quelle "sec"):
# Bei Meldungen ohne Quartalszahlen ist die Pflichtmitteilung oft die erste Veröffentlichung, und der
# Kurs braucht ein bis zwei Minuten (gemessen 13. bis 23.11.: nach 60 Sekunden erst 4 % der Bewegung).
# Läuft nur, wenn auf dem Server eine Kontaktadresse hinterlegt ist (/etc/trading-bot/sec.env,
# SEC_CONTACT=...); die SEC verlangt sie bei automatischen Abfragen.
enabled     = true
poll_s      = 600    # alle 10 Minuten vollständig zurückblättern
max_pages   = 8      # je 100 Meldungen; der Feed reicht etwa anderthalb Tage zurück
fast_poll_s = 2      # dazwischen nur die neuesten Meldungen, so oft (Limit der SEC: 10 Abfragen je Sekunde);
                     # nur von 6:00 bis 17:40 Uhr New Yorker Zeit, danach veröffentlicht die SEC erst am nächsten Morgen
fast_count  = 40     # so viele Meldungen je schneller Abfrage
rate        = true   # frische Meldungen lesen und bewerten (fast_rated mit source "sec")
trade       = true   # ... und handeln (Entscheidung Josh 24.11.2026: gleich handeln, nicht erst messen).
                     # false = nur bewerten; ein Kandidat steht dann als fast_rejected mit dem Grund source_off im Protokoll
skip_items  = ["5.03", "5.07", "9.01"]   # Meldungen, die NUR solche Punkte haben, werden nicht bewertet
                     # (Satzungsänderung, Abstimmungsergebnis der Hauptversammlung, bloße Anlagen)
skip_with_items = ["2.02"]   # Meldungen MIT einem dieser Punkte werden nicht bewertet: Quartalszahlen.
                     # Dort war die Pressemitteilung fast immer Minuten früher da (16 von 17 Fällen)

[speed]
# Tempo-Messung einmal täglich nach Börsenschluss: Kursverlauf im Sekundentakt nach jeder
# Pressemitteilung und SEC-Meldung, aus Handelsdaten des gesamten Marktes (kostenlos, sobald sie
# 15 Minuten alt sind). Kein Einfluss auf den Handel.
enabled         = true
after_close_min = 25
lookback_days   = 5      # so weit zurück werden noch nicht gemessene Meldungen nachgeholt
max_events      = 1500   # höchstens so viele Meldungen pro Lauf
secondary       = ["wa-", "finnhub"]   # Quellen, die Meldungen anderer wiederholen: Ihre Meldung zählt nur, wo kein Verteiler
                         # dieselbe Aktie in derselben Minute meldet (sonst würde dieselbe Meldung doppelt gemessen)
detail          = true   # zu jeder Meldung in einer gehandelten Aktie den Verlauf genauer festhalten (alle 5 Sekunden
                         # über 5 Minuten, jede Minute bis 30 Minuten, Geld- und Briefkurs kurz danach), um später
                         # nachzurechnen, was ein Einstieg mit Stop, Ziel und Zeitlimit gebracht hätte

[feedview]
# Messung ohne Einfluss auf den Handel: Alle fünf Minuten hält der Bot fest, bei wie vielen Aktien seine
# Kursquelle gerade einen Kurs zeigt, auf den sich ein Stop stützen könnte (Regel wie in [extended]).
# Verglichen werden zwanzig sehr liquide Aktien ([orb] static_pool) und die Aktien mit einer Meldung in
# der letzten Stunde. Das zeigt, zu welchen Zeiten die kostenlose Kursquelle reicht und wann nicht.
enabled  = true
every_s  = 300
max_news = 25

[llm]
# Welches Modell die Meldungen bewertet. Entscheidung Josh 17.11.2026: Vom 18. bis 20.11. entscheidet
# Opus; Haiku (bis dahin das entscheidende Modell) und Sonnet bewerten jede Meldung in der Handelszeit
# zum Vergleich mit ("Schatten"), ohne Einfluss auf den Handel. Auswertung im Wochenrückblick.
model              = "claude-opus-5-5"
shadow             = ["claude-haiku-5-5", "claude-sonnet-5-5"]
fallback           = "claude-haiku-5-5"   # dessen Bewertung zählt, wenn das entscheidende Modell nicht antwortet (muss in shadow stehen)
parallel           = 6       # so viele Meldungen werden gleichzeitig bewertet
max_calls_per_hour = 300     # je Modell
max_calls_per_day  = 600     # je Modell. Eine Bewertung kostet rund: Opus 0,6-1 Cent, Sonnet 0,3 Cent, Haiku 0,015 Cent
timeout_s          = 20

# Wie gründlich ein Modell vor der Antwort nachdenkt: "off" = gar nicht (am schnellsten), sonst
# "low", "medium" oder "high" (gründlicher, aber Sekunden langsamer und teurer). Opus kann nicht ohne.
[llm.effort]
"claude-opus-5-5"   = "medium"
"claude-sonnet-5-5" = "off"
"claude-haiku-5-5"  = "off"
