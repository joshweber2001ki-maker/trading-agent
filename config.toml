# Trading-Bot — Konfiguration
# Alle Stellschrauben der Strategie stehen hier. Zugangsdaten stehen NICHT hier,
# sondern in der Umgebung (siehe .env.example).

[risk]
risk_per_trade_pct     = 0.5    # Anteil des Depots, der pro Trade bis zum Stop riskiert wird
max_position_leverage  = 1.0    # größte Einzelposition als Vielfaches des Depots
max_gross_leverage     = 3.0    # Summe aller Positionen als Vielfaches des Depots
max_open_positions     = 4
max_trades_per_day     = 20
daily_loss_limit_pct   = 2.0    # ab diesem Tagesverlust keine neuen Einstiege mehr
min_price              = 5.0    # keine Aktien unter diesem Kurs

[execution]
entry_limit_offset_pct   = 0.15  # Einstiegslimit so weit über/unter dem letzten Kurs
entry_timeout_s          = 20    # nicht ausgeführte Einstiege nach dieser Zeit streichen
flatten_before_close_min = 10    # so viele Minuten vor Börsenschluss alles glattstellen
poll_s                   = 5     # Prüfintervall für offene Trades

[news]
enabled                  = true
max_article_age_s        = 90    # ältere Meldungen aus Alpacas Strom werden nicht mehr gehandelt
max_symbols              = 3     # Meldungen mit mehr Aktien sind Sammelartikel
min_surprise             = 7     # KI-Bewertung 0-10: wie überraschend
min_confidence           = 6     # KI-Bewertung 0-10: wie sicher die Richtung
min_impact               = 1     # KI-Bewertung 0-3: erwartete Kursbewegung; 0 = kaum, wird nicht gehandelt
confirm_window_s         = 300   # so lange auf Bestätigung durch den Kurs warten
min_move_pct             = 0.4   # Kurs muss mindestens so weit in die Richtung gelaufen sein (x Schwankungsfaktor)
max_chase_pct            = 3.0   # ist er schon weiter gelaufen, wird nicht hinterhergekauft (x Schwankungsfaktor)
volume_mult              = 2.0   # Minutenvolumen gegenüber dem Schnitt der letzten 30 Minuten
max_spread_pct           = 0.3   # größere Geld-/Brief-Spanne = zu illiquide
symbol_cooldown_min      = 60    # nach einem Signal Pause für dieselbe Aktie
start_after_open_min     = 5
no_entry_before_close_min = 30

# Schwankungsfaktor: übliche Tagesspanne der Aktie geteilt durch die einer Durchschnittsaktie.
# Stop, Mindestbewegung und Höchstbewegung werden damit multipliziert.
reference_daily_range_pct = 2.5
vol_factor_min           = 0.6
vol_factor_max           = 2.0
noise_mult               = 0.5   # der Stop liegt mindestens so viel x Kursspanne der letzten 5 Minuten entfernt
stop_floor_pct           = 0.3   # engster erlaubter Stop
stop_cap_pct             = 4.0   # weitester erlaubter Stop

# Handelsspanne je Wirkungs-Stufe der KI (für eine Durchschnittsaktie).
# stop_pct = Stop-Abstand, target_r = Kursziel als Vielfaches des Stop-Abstands.
[news.impact.1]   # mittel: etwa 1-3 % erwartet
stop_pct = 0.5
target_r = 2.0
max_hold_min = 30

[news.impact.2]   # groß: etwa 3-8 % erwartet
stop_pct = 1.0
target_r = 3.0
max_hold_min = 60

[news.impact.3]   # sehr groß: über 8 % erwartet
stop_pct = 2.0
target_r = 3.0
max_hold_min = 90

[orb]
# Abgeschaltet am 17.11.2026 (Entscheidung Josh): In der Rückrechnung verliert die kurze Form
# schon vor Kosten. Damit werden auch Meldungen außerhalb der Handelszeit nicht mehr bewertet.
enabled                  = false
range_min                = 5     # Länge der Eröffnungsspanne in Minuten (5, 10, 15 oder 30)
min_price                = 10.0
min_gap_pct              = 1.0   # Mindest-Kurslücke zur Eröffnung (gilt nicht für News-Kandidaten)
max_gap_pct              = 30.0  # darüber ist es meist ein Datenfehler oder eine Sondersituation
min_rvol                 = 1.0   # Volumen der Spanne gegenüber dem Schnitt der letzten 10 Tage
min_range_dollar_volume  = 1000000  # Mindestumsatz in der Spanne (auf dem IEX-Datenfeed)
min_range_pct            = 0.2   # zu enge Spanne = Zufallsausbruch
max_range_pct            = 2.5   # zu weite Spanne = Bewegung ist schon gelaufen
max_candidates           = 8     # die mit dem höchsten relativen Volumen werden beobachtet
exclude_funds            = true  # keine ETFs und Hebelprodukte
breakout_buffer_pct      = 0.05
stop_range_frac          = 0.5   # Stop-Abstand = Faktor x Breite der Spanne
stop_min_pct             = 0.3
stop_max_pct             = 1.0
target_r                 = 2.0
max_hold_min             = 30    # Zeitlimit pro Trade
direction                = "both"   # "both", "gap" (nur in Richtung der Kurslücke) oder "range" (nur in Richtung der Spanne)
entry_until              = "11:00"  # New Yorker Zeit, danach keine neuen Ausbrüche
# Meldungen außerhalb der Handelszeit liefern Kandidaten für die nächste Eröffnung:
premarket_news_from      = "00:00"  # New Yorker Zeit; zusammen mit dem Abend davor = durchgehend ab Börsenschluss
premarket_news_min_surprise = 6
news_candidate_max_age_h = 20    # ältere Meldungen zählen für die nächste Eröffnung nicht mehr
max_news_candidates      = 40    # höchstens so viele News-Kandidaten kommen in den Pool
# Liquide, schwankungsfreudige Aktien, die immer mit geprüft werden
static_pool = ["NVDA", "TSLA", "AMD", "META", "AMZN", "AAPL", "MSFT", "PLTR", "COIN", "AVGO", "NFLX", "SMCI", "MU", "GOOGL", "INTC", "MSTR", "HOOD", "UBER", "BA", "JPM"]

[wires]
# Zweite, schnellere Nachrichtenquelle: Pressemitteilungen direkt vom Verteiler PR Newswire.
# Alpacas eigener Nachrichtenstrom liefert Meldungen nur gebündelt etwa alle 30 Minuten.
enabled   = true
poll_s    = 60      # jeder Feed wird so oft abgefragt (der Anbieter erneuert ihn nur einmal pro Minute)
max_age_s = 420     # so alt darf eine Pressemitteilung für einen Trade höchstens sein
feeds = [
  "https://www.prnewswire.com/rss/news-releases-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/earnings-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/earnings-forecasts-projections-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/acquisitions-mergers-and-takeovers-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/contracts-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/stock-offering-list.rss",
  "https://www.prnewswire.com/rss/financial-services-latest-news/restructuring-recapitalization-list.rss",
  "https://www.prnewswire.com/rss/health-latest-news/fda-approval-list.rss",
  "https://www.prnewswire.com/rss/health-latest-news/clinical-trials-medical-discoveries-list.rss",
  "https://www.prnewswire.com/rss/general-business-latest-news/personnel-announcements-list.rss",
]

[edgar]
# Pflichtmitteilungen an die US-Börsenaufsicht SEC (Formular 8-K): nur mitschreiben, nicht handeln.
# Läuft nur, wenn auf dem Server eine Kontaktadresse hinterlegt ist (/etc/trading-bot/sec.env,
# SEC_CONTACT=...); die SEC verlangt sie bei automatischen Abfragen.
enabled   = true
poll_s    = 600    # alle 10 Minuten nach neuen Meldungen sehen
max_pages = 8      # je 100 Meldungen; der Feed reicht etwa anderthalb Tage zurück

[speed]
# Tempo-Messung einmal täglich nach Börsenschluss: Kursverlauf im Sekundentakt nach jeder
# Pressemitteilung und SEC-Meldung, aus Handelsdaten des gesamten Marktes (kostenlos, sobald sie
# 15 Minuten alt sind). Kein Einfluss auf den Handel.
enabled         = true
after_close_min = 25
lookback_days   = 5      # so weit zurück werden noch nicht gemessene Meldungen nachgeholt
max_events      = 1500   # höchstens so viele Meldungen pro Lauf

[llm]
# Welches Modell die Meldungen bewertet. Entscheidung Josh 17.11.2026: Vom 18. bis 20.11. entscheidet
# Opus; Haiku (bis dahin das entscheidende Modell) und Sonnet bewerten jede Meldung in der Handelszeit
# zum Vergleich mit ("Schatten"), ohne Einfluss auf den Handel. Auswertung im Wochenrückblick.
model              = "claude-opus-5-5"
shadow             = ["claude-haiku-5-5", "claude-sonnet-5-5"]
fallback           = "claude-haiku-5-5"   # dessen Bewertung zählt, wenn das entscheidende Modell nicht antwortet (muss in shadow stehen)
parallel           = 6       # so viele Meldungen werden gleichzeitig bewertet
max_calls_per_hour = 300     # je Modell
max_calls_per_day  = 600     # je Modell. Eine Bewertung kostet rund: Opus 0,6-1 Cent, Sonnet 0,3 Cent, Haiku 0,015 Cent
timeout_s          = 20

# Wie gründlich ein Modell vor der Antwort nachdenkt: "off" = gar nicht (am schnellsten), sonst
# "low", "medium" oder "high" (gründlicher, aber Sekunden langsamer und teurer). Opus kann nicht ohne.
[llm.effort]
"claude-opus-5-5"   = "medium"
"claude-sonnet-5-5" = "off"
"claude-haiku-5-5"  = "off"
